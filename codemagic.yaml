workflows:
  android-build:
    name: NovaPlay-Ultra CI Build
    max_build_duration: 60

    environment:
      java: 17

      vars:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Grant permissions
        script: |
          chmod +x gradlew

      - name: Verify Gradle
        script: |
          ./gradlew --version

      - name: Clean project
        script: |
          ./gradlew clean

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - rahman2008-svg@gmail.com
