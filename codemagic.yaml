workflows:
  android-build:
    name: NovaPlay-Ultra Android Build
    max_build_duration: 60

    environment:
      java: 17
      vars:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Grant permission
        script: |
          chmod +x gradlew

      - name: Clean project
        script: |
          ./gradlew clean

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk
